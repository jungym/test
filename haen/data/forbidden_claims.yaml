# Forbidden claims for the HAEN Hypercar Design Support AI.
#
# This system is a *design support* tool only. It must never assert any of the
# claims below. The forbidden claim checker (haen.governance) scans generated
# text for these patterns. Patterns are case-insensitive regular expressions.
#
# Both English and Korean (한국어) phrasings are covered. Hangul has no regex word
# boundaries, so Korean patterns are anchored on affirmative verbs (확보/보장/
# 입증/완료/가능/확정) to avoid matching negated framings such as "미평가"
# (not evaluated) or "미완료" (not complete).
forbidden_claims:
  - id: FC-001
    label: road legal
    explanation: >-
      Road legality depends on jurisdiction-specific type approval that this
      system does not assess. State "road-legality not assessed" instead.
    patterns:
      - "road[\\s-]?legal\\b"
      - "street[\\s-]?legal\\b"
      - "legal for (?:the )?road"
      - "도로[\\s]*주행[\\s]*합법"
      - "공도[\\s]*(?:주행[\\s]*)?합법"
      - "도로[\\s]*(?:주행|운행)[\\s]*가능[\\s]*인증"
      - "합법[\\s]*주행"

  - id: FC-002
    label: homologation ready
    explanation: >-
      Homologation readiness requires formal certification processes outside the
      scope of this tool. State "homologation status: not assessed".
    patterns:
      - "homologation[\\s-]?ready\\b"
      - "ready for homologation"
      - "fully homologated"
      - "homologation[\\s-]?complete\\b"
      - "형식[\\s]*(?:승인|인증)[\\s]*(?:완료|취득|준비[\\s]*완료)"

  - id: FC-003
    label: crash safe
    explanation: >-
      Crash safety requires physical and validated high-fidelity crash testing.
      Low-fidelity simulation cannot substantiate it. Use "crashworthiness not
      evaluated".
    patterns:
      - "crash[\\s-]?safe"
      - "crash[\\s-]?proof"
      - "crashworthiness (?:confirmed|proven|guaranteed)"
      - "safe in (?:a )?crash"
      - "충돌[\\s]*안전성?[\\s]*(?:확보|보장|입증|완료)"
      - "충돌[\\s]*안전성?[\\s]*검증[\\s]*완료"

  - id: FC-004
    label: production feasible
    explanation: >-
      Production feasibility requires manufacturing, tooling and supply-chain
      validation not performed here. Use "manufacturability not assessed".
    patterns:
      - "production[\\s-]?feasible\\b"
      - "production[\\s-]?ready\\b"
      - "ready for production"
      - "manufacturing[\\s-]?feasible\\b"
      - "feasible for (?:mass )?production"
      - "양산[\\s]*(?:가능|확정|준비[\\s]*완료)"
      - "상용화[\\s]*(?:가능|확정)"
      - "대량[\\s]*생산[\\s]*(?:가능|확정)"

  - id: FC-005
    label: supplier confirmed
    explanation: >-
      Supplier figures are evidence to be tracked, not confirmations. Use
      "supplier-quoted (unverified)" until evidence is verified by a human.
    patterns:
      - "supplier[\\s-]?confirmed"
      - "confirmed by (?:the )?supplier"
      - "supplier[\\s-]?guaranteed"
      - "vendor[\\s-]?confirmed"
      - "supplier[\\s-]?secured"
      - "공급(?:사|처|업체)[\\s]*(?:확정|확보|확인[\\s]*완료)"
      - "협력사[\\s]*(?:확정|확보)"
      - "(?:공급|납품)[\\s]*확정"

  - id: FC-006
    label: design complete
    explanation: >-
      This MVP supports early-stage exploration only. Use "design exploration
      in progress" rather than declaring completion or finality.
    patterns:
      - "design[\\s-]?(?:is\\s+)?complete\\b"
      - "design (?:is )?finali[sz]ed"
      - "final design"
      - "fully (?:designed|engineered)"
      - "설계[\\s]*(?:완료|확정)"
      - "최종[\\s]*설계"
      - "디자인[\\s]*(?:완료|확정)"

  - id: FC-007
    label: certification ready
    explanation: >-
      Certification requires formal, accredited processes outside the scope of
      this tool. State "certification status: not assessed".
    patterns:
      - "certification[\\s-]?ready\\b"
      - "ready for certification"
      - "certification[\\s-]?complete\\b"
      - "fully certified\\b"
      - "type[\\s-]?approved\\b"
      - "certified for (?:road|production|use|sale)"
      - "인증[\\s]*(?:완료|취득|획득|준비[\\s]*완료)"
      - "승인[\\s]*완료"

  - id: FC-008
    label: CFD validated
    explanation: >-
      This MVP performs only low-fidelity screening. It cannot validate
      aerodynamics by CFD. State "aero figures are low-fidelity screening
      estimates; CFD not performed".
    patterns:
      - "CFD[\\s-]?validated\\b"
      - "CFD[\\s-]?(?:proven|confirmed|verified)\\b"
      - "validated (?:by|via|with|using|through) CFD"
      - "aero(?:dynamics)?[\\s-]?(?:validated|confirmed) (?:by|via|with) CFD"
      - "CFD[\\s]*검증[\\s]*완료"
      - "(?:전산[\\s]*유체[\\s]*해석|공력)[\\s]*검증[\\s]*완료"

  - id: FC-009
    label: crash simulation complete
    explanation: >-
      No crash simulation is performed by this tool, and a completed crash
      simulation would still not substantiate crashworthiness. State
      "crash simulation not performed".
    patterns:
      - "crash[\\s-]?sim(?:ulation)?[\\s-]?(?:complete|completed|validated|passed|done)\\b"
      - "crash[\\s-]?(?:analysis|test)[\\s-]?(?:complete|completed|passed|validated)\\b"
      - "충돌[\\s]*(?:해석|시뮬레이션|시험)[\\s]*완료"
      - "충돌[\\s]*시험[\\s]*통과"

  - id: FC-010
    label: digital twin complete
    explanation: >-
      This MVP is not a validated digital twin. State "not a validated digital
      twin; low-fidelity screening models only".
    patterns:
      - "digital[\\s-]?twin[\\s-]?(?:complete|completed|validated|ready|done)\\b"
      - "(?<!not )(?<!not a )(?:fully )?(?:validated|completed) digital[\\s-]?twin\\b"
      - "디지털[\\s]*트윈[\\s]*(?:완료|구축[\\s]*완료|검증[\\s]*완료|검증)"
